# Daily maintenance for hosts without a scheduler (e.g. RumptyCloud): expiry sweep,
# overdue loans, webhook delivery. Needs repo secrets PAYVAULT_URL and CRON_SECRET.
name: cron
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        env:
          PAYVAULT_URL: ${{ secrets.PAYVAULT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PAYVAULT_URL" ]; then echo "PAYVAULT_URL not set; skipping"; exit 0; fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$PAYVAULT_URL/api/cron"
